name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run validate
        env:
          CONTENT_PATH: ${{ vars.CONTENT_PATH }}
          CONTENT_USERNAME: ${{ secrets.CONTENT_USERNAME }}
          CONTENT_PASSWORD: ${{ secrets.CONTENT_PASSWORD }}
      - run: npm test

  deploy:
    needs: validate
    if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
        env:
          CONTENT_PATH: ${{ vars.CONTENT_PATH }}
          CONTENT_USERNAME: ${{ secrets.CONTENT_USERNAME }}
          CONTENT_PASSWORD: ${{ secrets.CONTENT_PASSWORD }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
