stages:
  - validate
  - pages

validate:
  stage: validate
  image: node:22-alpine
  script:
    - npm install
    - npm run validate
    - npm test
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

pages:
  stage: pages
  image: node:22-alpine
  script:
    - npm install
    - npm run build
  artifacts:
    paths:
      - public
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
