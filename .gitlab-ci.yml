stages:
  - validate
  - pages

validate:
  stage: validate
  image: node:22-alpine
  script:
    - npm run validate
    - npm test
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

pages:
  stage: pages
  image: alpine:latest
  script:
    - mkdir -p public
    - cp -r index.html members.html projects.html events.html news.html pages.html assets data pages public/
  artifacts:
    paths:
      - public
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
